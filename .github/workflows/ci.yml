# =============================================================================
# ServiceHub — CI/CD Pipeline
# =============================================================================
# Triggers:
#   - On every push to develop
#   - On every pull request targeting develop
#
# Pipeline stages:
#   1. Lint & Test & GitLeaks Scan
#   2. Build Images (Saved as artifacts)
#   3. Trivy Security Scan & Integration Test
#   4. Push Images to ECR (Currently disabled)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [develop, feature/servicehub-updates]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
    # ===========================================================================
    # Stage 1: Linting, Testing, and Secrets Check
    # ===========================================================================
    lint-test-backend:
        name: Lint & Test (backend) - JDK ${{ matrix.java }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                java: ["17", "21"]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK ${{ matrix.java }}
              uses: actions/setup-java@v4
              with:
                  java-version: ${{ matrix.java }}
                  distribution: "temurin"

            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-maven-

            - name: Build and Test backend
              working-directory: ./backend
              run: mvn clean test -B

    lint-data-engineering:
        name: Lint (data-engineering)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
            - name: Install Flake8
              run: pip install flake8
            - name: Run Flake8
              working-directory: ./data-engineering
              run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    lint-devops:
        name: Lint (devops)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Run yamllint
              working-directory: ./devops
              run: |
                  sudo apt-get install -y yamllint
                  yamllint . -d "{extends: relaxed, rules: {line-length: disable}}"

    lint-qa:
        name: Lint (qa)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: QA Linting Placeholder
              run: echo "Depending on the QA framework (Selenium, Cypress, etc.), insert the linter here."

    gitleaks:
        name: GitLeaks Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # needed for gitleaks
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    sast-scan:
        name: Static Code Security Scan (CodeQL)
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            actions: read
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: "java"

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"

            - name: Build backend for CodeQL
              working-directory: ./backend
              run: mvn clean compile -B

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:java"
                  upload: never # Skip GHAS upload (fixes permission error on private repos)

            - name: Upload CodeQL Results as Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: codeql-results
                  path: ../results/**/*.sarif
                  retention-days: 7

    # ===========================================================================
    # Stage 2: Build Images
    # ===========================================================================
    build-images:
        name: Build Images
        runs-on: ubuntu-latest
        needs:
            [
                lint-test-backend,
                lint-data-engineering,
                lint-devops,
                lint-qa,
                gitleaks,
                sast-scan,
            ]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build backend Docker image
              run: docker build -t servicehub-backend:${{ github.sha }} ./backend
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dataeng: ${{ steps.filter.outputs.dataeng }}
      devops: ${{ steps.filter.outputs.devops }}
    steps:
      - uses: actions/checkout@v4
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - 'docker-compose*.yml'
            dataeng:
              - 'data-engineering/**'
            devops:
              - 'devops/**'
              - 'docker-compose*.yml'

  lint-test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/_reusable-lint-test-backend.yml

  lint-data-engineering:
    needs: changes
    if: needs.changes.outputs.dataeng == 'true'
    uses: ./.github/workflows/_reusable-lint-data-engineering.yml

  lint-devops:
    needs: changes
    if: needs.changes.outputs.devops == 'true'
    uses: ./.github/workflows/_reusable-lint-devops.yml

  build-images:
    name: Build backend image
    needs:
      - lint-test-backend
      - lint-data-engineering
      - lint-devops
    uses: ./.github/workflows/_reusable-build-backend-image.yml
    with:
      image-name: servicehub-backend

  security-scans:
    name: Security scans
    needs: build-images
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_reusable-security-scans.yml
    with:
      image-name: ${{ needs.build-images.outputs.image_name }}
      image-tag: ${{ needs.build-images.outputs.image_tag }}

  integration-test:
    name: Integration smoke test
    needs: build-images
    uses: ./.github/workflows/_reusable-integration-smoke.yml
    with:
      image-name: ${{ needs.build-images.outputs.image_name }}
      image-tag: ${{ needs.build-images.outputs.image_tag }}
    secrets: inherit # pragma: allowlist secret

  publish-ecr:
    name: Publish to ECR
    needs:
      - build-images
      - integration-test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_reusable-publish-ecr.yml
    with:
      image-name: ${{ needs.build-images.outputs.image_name }}
      image-tag: ${{ needs.build-images.outputs.image_tag }}
    secrets: inherit # pragma: allowlist secret
